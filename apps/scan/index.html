<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Hetja</title>
<meta name="description" content="Scan a collar to see this dog and get it help." />
<link rel="icon" href="data:," />
<style>
/* Hetja collar page: design v4 (docs/design/v4-handoff, screens 03 to 05) on
   the tokens in packages/design/tokens.css. Values below are copied by hand
   (not @imported) because this stylesheet is inlined into the hot-path HTML,
   so the page cannot afford a second stylesheet request. This copy omits
   tokens the page does not use, but every name it carries must keep the
   exact value it has in tokens.css; change both together.

   Font: --h-font is the tokens.css stack verbatim. Apple devices match
   -apple-system (real SF, zero bytes) before "Inter" is ever reached, so
   they never download the file below. Everyone else (Android) gets a small
   self-hosted Inter subset: basic Latin plus the few symbols this page
   prints (· ‹ › ’ …), weights 400 to 700 as one variable file, no hinting,
   about 13 KB. font-display: swap, so text renders at once in the fallback
   and the file never blocks the SOS button.

   Plain white, no aurora, no animation, nothing that loops: this is a
   working screen for a stranger standing over a dog on a budget phone. */
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;src:url(/d/inter-scan.woff2) format("woff2");unicode-range:U+0020-007E,U+00A0,U+00B7,U+00D7,U+2019,U+2026,U+2039,U+203A}
:root{--h-ink:#1d1d1f;--h-secondary:#6e6e73;--h-text-mid:#48484d;--h-line:#d2d2d7;--h-divider:#e8e8ed;--h-mist:#f5f5f7;--h-white:#ffffff;
--h-link:#0066cc;--h-blue:#0071e3;--h-blue-tint:#e8f1fc;--h-blue-tint-ink:#0062c4;--h-sos:#d70015;--h-sos-press:#b80012;
--h-ok-bg:#e6f4ea;--h-ok:#1a7a35;--h-warn-bg:#fff3e0;--h-warn:#9a5200;--h-neutral-bg:#f2f2f5;--h-neutral:#48484d;--h-danger-bg:#fde8ea;--h-danger:#b80012;
--h-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Roboto,Helvetica,Arial,sans-serif;
--h-mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
--h-gutter:20px;--h-r-input:16px;--h-r-inner:20px;--h-r-card:28px;--h-r-pill:999px;
--h-sh-footer:0 -1px 0 #e8e8ed;--h-ring-input:inset 0 0 0 1.5px var(--h-line);--h-ring-focus:inset 0 0 0 2px var(--h-blue);--h-focus:3px solid rgba(0,113,227,0.45);
--h-btn-sos-h:60px;--h-target:44px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--h-white);color:var(--h-ink);-webkit-text-size-adjust:100%}
body{font-family:var(--h-font);font-size:17px;line-height:1.47;-webkit-font-smoothing:antialiased;max-width:480px;margin:0 auto;background:var(--h-white)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--h-link);text-decoration:none}
a:focus-visible,button:focus-visible,textarea:focus-visible,.opt:has(input:focus-visible){outline:var(--h-focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.view{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.body{flex:1;display:flex;flex-direction:column;gap:16px;padding:calc(8px + env(safe-area-inset-top)) var(--h-gutter) 24px}
.foot{position:sticky;bottom:0;z-index:2;background:var(--h-white);display:flex;flex-direction:column;gap:8px;padding:14px var(--h-gutter) max(16px,env(safe-area-inset-bottom))}
.foot.line{box-shadow:var(--h-sh-footer)}
.title{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-0.03em}
.lead{font-size:17px;line-height:1.4;color:var(--h-secondary)}
.label{font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--h-secondary)}
.cap{font-size:13px;line-height:1.35;color:var(--h-secondary);text-align:center}
.feedlink{display:block;min-height:44px;line-height:44px;margin-top:4px;text-align:center;font-size:15px;color:var(--h-link);text-decoration:none}
#note:empty{display:none}
.banner{background:var(--h-mist);border-radius:var(--h-r-input);font-size:15px;line-height:1.4;padding:12px 16px}
#state{padding-top:24px;display:flex;flex-direction:column;gap:8px}
/* 03 Dog profile */
#profile{display:flex;flex-direction:column;gap:16px}
.photo{height:210px;border-radius:var(--h-r-card);overflow:hidden;flex:none;background:var(--h-mist)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.initial{height:100%;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:700;letter-spacing:-0.035em}
.name-blk{display:flex;flex-direction:column;gap:6px}
.name{font-size:40px;line-height:1;font-weight:700;letter-spacing:-0.035em;overflow-wrap:anywhere}
.ward{font-size:17px;line-height:1.3;color:var(--h-secondary)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:36px;padding:0 14px 0 10px;border-radius:var(--h-r-pill);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill svg{flex:none}
.pill.sm{height:32px;padding:0 12px 0 8px;font-size:14px}
.ok{background:var(--h-ok-bg);color:var(--h-ok)}.warn{background:var(--h-warn-bg);color:var(--h-warn)}
.neutral{background:var(--h-neutral-bg);color:var(--h-neutral)}.danger{background:var(--h-danger-bg);color:var(--h-danger)}
.code-card{background:var(--h-mist);border-radius:var(--h-r-inner);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.code-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.code-col{display:flex;flex-direction:column;gap:4px}
.code{font-family:var(--h-mono);font-size:30px;line-height:1.2;font-weight:600;letter-spacing:0.06em;display:flex;gap:14px}
.say{font-size:15px;line-height:1.35;color:var(--h-secondary)}
.quiet{height:var(--h-target);padding:0 14px;border-radius:var(--h-r-pill);background:#e8e8ed;font-size:15px;font-weight:600;flex:none}
.quiet:active{background:var(--h-line)}
.story{font-size:17px;line-height:1.47;text-wrap:pretty}
.by{font-size:15px;color:var(--h-secondary)}
.btn{width:100%;border-radius:var(--h-r-pill);display:flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation}
.sos{height:var(--h-btn-sos-h);background:var(--h-sos);color:#fff;font-size:18px;font-weight:700}
.sos:active{background:var(--h-sos-press);transform:scale(.98)}
.sos:disabled{opacity:.35;cursor:default;transform:none;background:var(--h-sos)}
.sos svg{flex:none}
.sos:focus-visible{outline-offset:3px}
/* 04 SOS, step 1 */
.top{height:52px;flex:none;display:flex;align-items:center;padding:0 var(--h-gutter);margin-top:env(safe-area-inset-top)}
.back{min-height:var(--h-target);font-size:17px;color:var(--h-link);margin-left:-4px;padding:0 4px}
.sos-body{gap:14px;padding-top:4px}
.opts{border:0;display:flex;flex-direction:column;gap:10px;margin-top:6px;min-width:0}
.opt{position:relative;box-sizing:content-box;min-height:84px;border-radius:var(--h-r-inner);box-shadow:inset 0 0 0 1.5px var(--h-line);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt.on{box-shadow:inset 0 0 0 3px var(--h-ink);background:var(--h-mist)}
.dot{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px #aeaeb2;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.dot svg{visibility:hidden}
.opt.on .dot{background:var(--h-ink);box-shadow:none}
.opt.on .dot svg{visibility:visible}
.opt-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt-t{font-size:18px;line-height:1.25;font-weight:600}
.opt-s{font-size:15px;line-height:1.3;color:var(--h-secondary)}
.add{min-height:52px;width:100%;border-radius:var(--h-r-input);background:var(--h-mist);display:flex;align-items:center;padding:0 16px;font-size:16px;color:var(--h-text-mid);text-align:left}
.extras{display:flex;flex-direction:column;gap:10px}
.field{width:100%;min-height:96px;border:0;border-radius:var(--h-r-input);box-shadow:var(--h-ring-input);padding:12px 16px;font:inherit;font-size:17px;color:var(--h-ink);resize:vertical;background:var(--h-white)}
.field:focus{outline:none;box-shadow:var(--h-ring-focus)}
.field::placeholder{color:#86868b}
.photo-row{display:flex;align-items:center;gap:12px}
/* 05 SOS sent */
.sent-body{gap:14px;padding-top:calc(28px + env(safe-area-inset-top))}
.big-ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.msg{font-size:17px;line-height:1.47}
.call-l{margin-top:10px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;min-height:76px;padding:8px 0}
.row+.row{border-top:1px solid var(--h-divider)}
.row-txt{flex:1;min-width:0}
.row-t{font-size:17px;line-height:1.3;font-weight:600}
.row-s{font-size:15px;line-height:1.35;color:var(--h-secondary)}
.tint{height:48px;padding:0 20px;border-radius:var(--h-r-pill);background:var(--h-blue-tint);color:var(--h-blue-tint-ink);font-size:16px;font-weight:600;display:flex;align-items:center;flex:none}
.tint:active{background:#d5e6fa}
.link-btn{height:52px;width:100%;font-size:17px;color:var(--h-link)}
/* v5: badges, review banner, memorial (docs/design/v5-handoff) */
.badge{align-self:flex-start;height:28px;padding:0 12px;border-radius:var(--h-r-pill);background:var(--h-neutral-bg);color:var(--h-neutral);font-size:13px;font-weight:600;display:inline-flex;align-items:center}
.review{display:flex;gap:10px;align-items:flex-start;background:var(--h-warn-bg);color:var(--h-warn);border-radius:var(--h-r-input);padding:12px 16px;font-size:15px;line-height:1.4}
.review svg{flex:none;margin-top:1px}
.names{list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:17px}
#tag-open{width:100%}
/* F4 sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:var(--h-white);border-radius:32px 32px 0 0;padding:10px var(--h-gutter) max(26px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--h-line)}
.sheet-t{font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-0.02em;padding-top:4px}
.group{background:var(--h-mist);border-radius:var(--h-r-inner);padding:4px 16px;display:flex;flex-direction:column}
.grow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;width:100%;text-align:left}
.grow+.grow{border-top:1px solid var(--h-divider)}
.grow:disabled{opacity:.5}
.gtx{display:flex;flex-direction:column;gap:1px}
.g-t{font-size:17px}
.g-s{font-size:13px;color:var(--h-secondary)}
.chev{font-size:20px;color:#86868b;flex:none}
.fn{font-size:13px;line-height:1.45;color:var(--h-secondary);padding:0 4px}
/* F5 */
#v-tag,.view.mist,.view.mist .foot{background:var(--h-mist)}
.top.end{justify-content:flex-end}
.tag-body{gap:18px;padding-top:8px}
.big-ic.lg{width:64px;height:64px}
.wcard{background:var(--h-white);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.wc-t{font-size:17px;font-weight:600}
.steps{list-style:none;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.45}
.steps li{display:flex;gap:12px}
.num{width:26px;height:26px;border-radius:50%;background:var(--h-mist);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.wcard.seen{border-radius:var(--h-r-inner);min-height:60px;padding:8px 16px;flex-direction:row;align-items:center;justify-content:space-between}
.chip{min-height:var(--h-target);padding:0 14px;border-radius:var(--h-r-pill);background:var(--h-mist);font-size:15px;font-weight:600;color:var(--h-link);flex:none}
/* N8 */
.nf-top{height:44px;display:flex;align-items:center}
.nf-code{font-family:var(--h-mono);font-size:30px;font-weight:600;letter-spacing:0.08em;color:#86868b;overflow-wrap:anywhere}
.card{background:var(--h-white);border-radius:var(--h-r-inner);padding:4px 16px;display:flex;flex-direction:column}
.nav,.sugg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;color:var(--h-ink);font-size:17px}
.nav+.nav,.sugg+.sugg{border-top:1px solid var(--h-divider)}
.sugg{min-height:76px;justify-content:flex-start}
.sugg .gtx{flex:1;min-width:0}
.sugg-m{font-family:var(--h-mono);font-size:13px;color:var(--h-secondary)}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;background:var(--h-mist)}
.av img,.av span{width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));width:calc(100% - 40px);max-width:440px;background:var(--h-ink);color:#fff;border-radius:var(--h-r-input);padding:12px 16px;font-size:15px;text-align:center;z-index:30}
</style>
</head>
<body>
<main id="v-profile" class="view">
  <div class="body">
    <div id="state">
      <p id="status" class="title">Loading&hellip;</p>
      <p id="sub" class="lead"></p>
    </div>
    <div id="note"></div>
    <section id="profile" class="hidden" aria-live="polite"></section>
  </div>
  <div class="foot line" id="main-foot">
    <button type="button" id="primary-cta" class="btn sos" disabled>
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="11" fill="#fff"/><path d="M11 5.8v6.4" stroke="#d70015" stroke-width="2.8" stroke-linecap="round"/><circle cx="11" cy="16" r="1.6" fill="#d70015"/></svg>
      <span>This dog needs help</span>
    </button>
    <p id="cta-cap" class="cap">Alerts this dog's feeders and a vet nearby.</p>
    <a id="feed-link" class="feedlink hidden" href="/feed">Log a feed &#8250;</a>
  </div>
</main>
<section id="v-sos" class="view hidden" aria-label="SOS"></section>
<section id="v-sent" class="view hidden" aria-label="SOS sent"></section>
<section id="v-tag" class="view hidden" aria-label="Tag problem reported"></section>
<div id="sheet" class="hidden"></div>
<div id="toast" class="toast hidden" role="status"></div>
<!-- Served under /d/ on purpose. A relative "./main.js" resolves to
     /d/main.js only for /d/<slug> and breaks for any other depth, while a
     root-absolute "/main.js" leaves this path prefix entirely and is routed
     to the Next.js app by the reverse proxy, which 404s. Requesting
     /d/main.js explicitly is correct at every depth and stays within the
     single /d/* proxy route. The font URL above follows the same rule. -->
<script src="/d/main.js" defer></script>
</body>
</html>

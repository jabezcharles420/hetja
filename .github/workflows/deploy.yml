# .github/workflows/deploy.yml: push to main, everything follows.
#
# Gate -> Migrate -> Deploy. Nothing in Migrate or Deploy runs unless Gate is
# fully green, and Deploy never runs unless Migrate (including its destructive-
# change check) passes.
#
# Builds are split by cost. apps/web and apps/scan are built HERE on the runner
# and shipped over rsync into a timestamped release directory, with a `current`
# symlink flipped on the box -- see apps/web/next.config.mjs for why
# `output: 'standalone'` is required (the box is a 2 GB VPS that `next build`
# previously OOM-killed alongside the already-running services). @hetja/api and
# @hetja/worker are plain tsc, run from the git checkout at /root/hetja rather
# than from a release directory, and are built ON THE BOX from this exact SHA --
# see ops/deploy-remote.sh for that server-side half.
#
# Both halves matter: shipping only web and scan while restarting all four units
# is a deploy that goes green with a stale API, which is what this pipeline
# originally did.
#
# ---------------------------------------------------------------------------
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#
#   Deploy SSH access to the VPS
#     DEPLOY_SSH_KEY        Private half of a NEW, dedicated ed25519 deploy
#                            key -- generate one specifically for this
#                            pipeline (e.g. `ssh-keygen -t ed25519 -C
#                            "github-actions-deploy@hetja"`) and add the
#                            public half to the VPS's authorized_keys for
#                            the deploy user. Do NOT reuse `webapp_deploy` --
#                            that is GitHub's own key for its side of the
#                            pull (e.g. pulling from a private registry or
#                            similar), a different trust boundary from "a
#                            CI runner can SSH into production."
#     DEPLOY_SSH_HOST        VPS hostname/IP (NAT'd -- the runner connects
#                            OUT to it, so no inbound firewall change is
#                            needed).
#     DEPLOY_SSH_PORT        Non-standard SSH port. Never hardcode this --
#                            it lives in the deploy operator's local
#                            ~/.ssh/config (Host aic) precisely because the
#                            host is NAT'd behind a port that isn't 22.
#     DEPLOY_SSH_USER         SSH user on the VPS (currently `root`).
#
#   Supabase (migration stage, applied over the connection pooler)
#     SUPABASE_POOLER_HOST    e.g. aws-0-ap-south-1.pooler.supabase.com
#     SUPABASE_POOLER_PORT    Use the SESSION pooler port (5432), not the
#                            transaction pooler (6543) -- migrate.ts runs
#                            multi-statement transactions per file, which
#                            the transaction pooler's connection reuse can
#                            break.
#     SUPABASE_PROJECT_REF    The project ref segment from the dashboard
#                            URL; the pooler username is
#                            `postgres.<project-ref>`.
#     SUPABASE_DB_PASSWORD    The project's database password (not an API
#                            key).
#
#   Brevo SMTP (reserved -- a sibling agent is wiring up email OTP delivery
#   separately; these names are reserved now so that work can land without
#   a workflow edit, but nothing in this workflow reads them yet)
#     BREVO_SMTP_HOST
#     BREVO_SMTP_PORT
#     BREVO_SMTP_USER
#     BREVO_SMTP_PASSWORD
#
# ---------------------------------------------------------------------------

name: Deploy

on:
  # Manual runs deploy any ref (first bring-up of the shared-box room ran this
  # way from a branch, before anything was merged to main).
  workflow_dispatch:
    inputs:
      supabase_migrate:
        description: "Apply new migrations to Supabase (the production DB)"
        type: boolean
        default: false
  push:
    branches: [main]
    # A documentation-only commit does not need to rebuild apps/web on a runner,
    # rsync a release, rebuild the API on a 2 GB box that has OOM-killed the live
    # services before, apply migrations to two databases and restart all four
    # units. It did all of that until now, because this trigger had no filter.
    #
    # GitHub skips the workflow only when EVERY changed path matches, so a commit
    # touching both a doc and a source file still deploys. Note what is
    # deliberately NOT ignored: ops/**, .github/** and the systemd units all
    # affect the box, so they must keep deploying.
    #
    # This also matters for anything that commits to main on a schedule. Upptime
    # (enhancement stack Top-25 #25) writes response-time data and graphs back
    # into its own repository on every check -- installing it in THIS repository
    # would have redeployed production every few minutes. That is why Upptime
    # belongs in a separate repo, which is how upstream ships it anyway.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# Never run two deploys at once against the same box; let one finish
# (including any rollback) before the next starts.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  NODE_VERSION: 20
  # Supabase schema mirror. "true" applies each push's migrations to the
  # Supabase project through its session pooler; "false" skips that step and
  # only the destructive-change gate runs. Set to "false" on 2026-09-05 because
  # the Supabase database is paused. With it on, a green Gate was followed by
  # a Migrate job failing to connect, which blocked every deploy to the box even
  # though production reads the LOCAL PostgreSQL (AGENTS.md §b). Flip back to
  # "true" when the project is resumed, then re-run the workflow once: the
  # migration runner is idempotent and will apply everything the mirror missed.
  # Supabase is the production database since the shared-box room (ops/room).
  # Pushes to main migrate; manual runs migrate only when asked.
  SUPABASE_MIGRATE: ${{ github.event_name == 'push' || inputs.supabase_migrate == true }}

# Least privilege for GITHUB_TOKEN. With no `permissions:` block the token
# inherits the repository default, which on repos created before GitHub changed
# it is read/write across every scope. Nothing in these workflows writes to the
# repo through the API. They read code, run gates, and (in deploy.yml) reach
# the box over SSH, so read-only on contents is the whole requirement.
permissions:
  contents: read

jobs:
  # =========================================================================
  # GATE -- must be fully green before anything touches Supabase or the VPS.
  # Pattern copied from .github/workflows/ci.yml (not edited here).
  # =========================================================================
  gate:
    name: Gate (typecheck, test, security, size)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: hetja_test
          # Superuser: migrations must create postgres-owned tables, matching
          # production. With app_user owning them, 0001_init.sql's REVOKE on
          # medical_records strips the owner's own rights and the FK check
          # behind `DELETE FROM dogs` fails as that owner (48 test failures).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hetja_dev_2026
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: hetja_test
      # Default identity for the gates: app_user, exactly as production runs.
      PGUSER: app_user
      PGPASSWORD: hetja_dev_2026
      # Used only by the extension, migrate and grant steps below.
      PG_SUPERUSER_PASSWORD: hetja_dev_2026
      # Password assigned to app_user when CI creates the role.
      PGPASSWORD_APP: hetja_dev_2026
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      # No `version:` here on purpose: pnpm/action-setup@v4 reads
      # `packageManager` from package.json, and passing both makes it
      # fail with "Multiple versions of pnpm specified".

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build workspace libraries
        # @hetja/{ledger,contracts,db} expose `types: dist/index.d.ts` and dist/
        # is gitignored, so on a clean checkout every consumer fails typecheck
        # with "cannot find module ... or its corresponding type declarations".
        # Build them before any gate that resolves those imports. Order matches
        # ops/deploy.sh.
        run: |
          set -euo pipefail
          pnpm --filter @hetja/ledger build
          pnpm --filter @hetja/contracts build
          pnpm --filter @hetja/db build
          # The size gate measures apps/scan/dist, which is gitignored -- build it
          # here or the gate dies on a missing file rather than a real budget
          # breach.
          pnpm --filter @hetja/scan build


      - name: Install pgvector into the Postgres service container
        # postgis/postgis ships PostGIS + contrib but not pgvector, and no
        # official image carries both. 0001_init.sql needs VECTOR(768) for
        # dogs.cv_embedding, so pull it from PGDG (already configured in the
        # image) rather than maintaining a custom image for CI.
        run: |
          set -euo pipefail
          CID=$(docker ps --filter "ancestor=postgis/postgis:16-3.4" --format '{{.ID}}' | head -1)
          if [ -z "$CID" ]; then
            echo "::error::could not find the postgres service container"
            docker ps
            exit 1
          fi
          docker exec "$CID" bash -c \
            'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-16-pgvector'

      - name: Enable PostGIS, pgvector and pgcrypto
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.PG_SUPERUSER_PASSWORD }}
        run: |
          set -euo pipefail
          for ext in postgis vector pgcrypto; do
            echo "--> CREATE EXTENSION $ext"
            psql -h 127.0.0.1 -d hetja_test \
              -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS $ext;"
          done

      - name: Create the app_user role
        # Must precede migrations: 0001_init.sql ends with
        # `REVOKE UPDATE, DELETE ON medical_records FROM app_user`, which errors
        # with `role "app_user" does not exist` if the role is not there yet.
        # The old config created it implicitly via POSTGRES_USER=app_user; now
        # that the container runs as postgres, CI has to create it explicitly.
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.PG_SUPERUSER_PASSWORD }}
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN
               IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_user') THEN
                 CREATE ROLE app_user LOGIN PASSWORD '${{ env.PGPASSWORD_APP }}';
               END IF;
             END \$\$;"
          psql -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO app_user;"

      - name: Apply migrations
        # Run as postgres so tables are owned by postgres, as in production.
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.PG_SUPERUSER_PASSWORD }}
        run: pnpm --filter @hetja/db migrate

      - name: Grant app_user production's privilege set
        # After migrations, because the tables must exist to be granted on.
        # Production has postgres-owned tables with app_user holding grants; that
        # is load-bearing, because a NO ACTION foreign key's integrity check runs
        # as the REFERENCING table's owner.
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.PG_SUPERUSER_PASSWORD }}
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO app_user;"
          psql -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;"
          # INVARIANT 9: medical_records stays append-only for the app role.
          # Re-applied after the blanket GRANT, which would hand DELETE back.
          psql -v ON_ERROR_STOP=1 -c "REVOKE UPDATE, DELETE ON medical_records FROM app_user;"

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Unit tests (all packages)
        # Serial across packages, on purpose. apps/api, apps/worker and packages/db
        # all hit the same hetja_test database; with pnpm's default concurrency of
        # 4 the worker suite's processOneJob() claimed and deleted the send_sos_push
        # jobs sos.test.ts was asserting on, and api-enqueued jobs surfaced inside
        # the worker's retry test. That race is why this step failed on a
        # docs-only commit and passed/failed the same SHA twice (2026-08-27).
        run: pnpm -r --workspace-concurrency=1 test

      - name: Security gate
        run: bash ops/security-gate.sh

      - name: EXPLAIN gate (INVARIANT 12)
        run: bash ops/check-queries.sh

      - name: Scan bundle size gate (<40 KB gzipped)
        run: pnpm --filter @hetja/scan size:gate

      # The gates below were added to ci.yml in wave 3 but never mirrored here,
      # so the two workflows had divergent gate sets and NEITHER was a superset:
      # ci.yml lacked the size gate, deploy.yml lacked these three. The
      # deploy path is the one that actually reaches production, so a gate
      # missing here is the more expensive half of that mistake.
      - name: Contrast gate (WCAG-AA on design tokens)
        run: bash ops/contrast-gate.sh

      - name: Caddy cache-policy gate (life-safety no-store on /d/*)
        run: bash ops/check-caddy-cache.sh

      - name: systemd wiring gate (every unit is installed by bootstrap.sh)
        run: bash ops/check-systemd.sh

  # =========================================================================
  # MIGRATE -- fail closed on anything destructive. medical_records is
  # append-only and a bad migration against the live Supabase project is not
  # reversible, so this is the one gate in the whole pipeline with no
  # override except an explicit human marker committed to the SQL file
  # itself.
  # =========================================================================
  migrate:
    name: Migrate (destructive-change gate, then apply)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      # No `version:` here on purpose: pnpm/action-setup@v4 reads
      # `packageManager` from package.json, and passing both makes it
      # fail with "Multiple versions of pnpm specified".

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build workspace libraries
        # @hetja/{ledger,contracts,db} expose `types: dist/index.d.ts` and dist/
        # is gitignored, so on a clean checkout every consumer fails typecheck
        # with "cannot find module ... or its corresponding type declarations".
        # Build them before any gate that resolves those imports. Order matches
        # ops/deploy.sh.
        run: |
          set -euo pipefail
          pnpm --filter @hetja/ledger build
          pnpm --filter @hetja/contracts build
          pnpm --filter @hetja/db build


      - name: Find migrations new in this push
        id: new_migrations
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            # First push to main we've seen the parent of (new branch, or a
            # force-push GitHub reports as all-zeros before): fall back to
            # the immediate parent commit rather than skipping the check.
            BASE="$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo "")"
          fi

          if [ -z "$BASE" ]; then
            echo "no usable base commit -- treating every existing migration file as new"
            FILES="$(git ls-files 'packages/db/migrations/*.sql')"
          else
            echo "diffing $BASE..${{ github.sha }}"
            FILES="$(git diff --diff-filter=A --name-only "$BASE" "${{ github.sha }}" -- 'packages/db/migrations/*.sql')"
          fi

          echo "new migration files:"
          echo "${FILES:-<none>}"

          {
            echo "files<<__EOF__"
            echo "$FILES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Destructive-change gate
        # The gate itself lives in ops/check-destructive-migrations.sh so it can
        # be run before pushing and negative-tested, instead of being 40 lines of
        # untestable shell that only ever executes here. Its previous inline
        # comment-stripper (`sed -e 's/--.*$//'`) deleted everything after the
        # first `--` on a line, including real SQL following a `--` inside a
        # string literal -- so `INSERT INTO t VALUES ('a -- b'); DROP TABLE
        # medical_records;` passed the gate. See the script header.
        run: |
          set -euo pipefail
          FILES="${{ steps.new_migrations.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "no new migration files in this push -- nothing to gate"
            exit 0
          fi
          # shellcheck disable=SC2086
          echo "$FILES" | xargs -r ./ops/check-destructive-migrations.sh

      - name: Supabase state (read-only diagnostic)
        # Always runs, changes nothing: shows which migrations Supabase has
        # recorded and how much data it holds, so a first migrate against a
        # database that was set up by hand (ops/supabase/cutover.sh) is never a
        # surprise.
        env:
          PGHOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          PGPORT: ${{ secrets.SUPABASE_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ secrets.SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -uo pipefail
          psql -X -v ON_ERROR_STOP=0 -At <<'SQL'
          \echo == reachable
          select now(), current_user, version();
          \echo == recorded migrations
          select coalesce(string_agg(filename, ' ' order by filename), '<none>') from schema_migrations;
          \echo == repo migrations not recorded (computed below)
          \echo == row counts
          select 'dogs', count(*) from dogs union all select 'identities', count(*) from identities
            union all select 'care_providers', count(*) from care_providers union all select 'feed_events', count(*) from feed_events;
          SQL
          echo "repo migrations: $(ls packages/db/migrations | xargs echo)"

      - name: Apply migrations to Supabase (session pooler)
        if: env.SUPABASE_MIGRATE == 'true'
        env:
          PGHOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          PGPORT: ${{ secrets.SUPABASE_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ secrets.SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: pnpm --filter @hetja/db migrate

      - name: Supabase mirror skipped
        if: env.SUPABASE_MIGRATE != 'true'
        run: |
          echo "SUPABASE_MIGRATE=${SUPABASE_MIGRATE}: not applying migrations (manual run without supabase_migrate)."

  # =========================================================================
  # DEPLOY -- build everything HERE (never on the box), ship one tarball to
  # the shared box's resource-capped room (ops/room), flip a symlink as the
  # unprivileged `hetja` user, health-check, roll back on failure.
  # The box is shared with an agent that has priority: nothing in this job
  # runs as root there, compiles there, or touches anything outside /srv/hetja.
  # =========================================================================
  deploy:
    name: Deploy to the room (build here, ship, flip, health-check)
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build everything
        env:
          # Inlined into the browser bundle at build time.
          NEXT_PUBLIC_API_URL: https://api.hetja.in
          NEXT_PUBLIC_ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          pnpm --filter @hetja/ledger build
          pnpm --filter @hetja/contracts build
          pnpm --filter @hetja/db build
          pnpm --filter @hetja/api build
          pnpm --filter @hetja/worker build
          pnpm --filter @hetja/scan build
          pnpm --filter @hetja/web build

      - name: Assemble release
        id: release
        run: |
          set -euo pipefail
          ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          bash ops/room/build-release.sh "$RUNNER_TEMP/$ID.tar.gz"

      - name: Write env files from secrets
        env:
          PGHOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          PGPORT: ${{ secrets.SUPABASE_POOLER_PORT }}
          PGREF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.HETJA_JWT_SECRET }}
          HETJA_HMAC_PEPPER: ${{ secrets.HETJA_HMAC_PEPPER }}
          HETJA_QR_SECRET: ${{ secrets.HETJA_QR_SECRET }}
          HETJA_DEVICE_SECRET: ${{ secrets.HETJA_DEVICE_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          BREVO_SMTP_HOST: ${{ secrets.BREVO_SMTP_HOST }}
          BREVO_SMTP_PORT: ${{ secrets.BREVO_SMTP_PORT }}
          BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SMTP_PASS: ${{ secrets.BREVO_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for v in PGHOST PGPORT PGREF PGPASSWORD JWT_SECRET HETJA_HMAC_PEPPER HETJA_QR_SECRET HETJA_DEVICE_SECRET BREVO_SMTP_HOST BREVO_SMTP_USER BREVO_SMTP_PASS; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is empty"; exit 1; }
          done
          {
            # PORT/HOST/NODE_ENV come from the systemd units.
            printf 'PGHOST=%s\nPGPORT=%s\nPGDATABASE=postgres\nPGUSER=postgres.%s\n' "$PGHOST" "$PGPORT" "$PGREF"
            printf 'PGPASSWORD=%s\nPGSSLMODE=require\nPGPOOL_MAX=4\n' "$PGPASSWORD"
            printf 'JWT_SECRET=%s\nJWT_ACCESS_TTL=15m\nJWT_REFRESH_TTL=30d\n' "$JWT_SECRET"
            printf 'HETJA_HMAC_PEPPER=%s\nHETJA_QR_SECRET=%s\nHETJA_DEVICE_SECRET=%s\n' "$HETJA_HMAC_PEPPER" "$HETJA_QR_SECRET" "$HETJA_DEVICE_SECRET"
            printf 'VAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nVAPID_SUBJECT=mailto:no-reply@hetja.in\n' "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY"
            printf 'BREVO_SMTP_HOST=%s\nBREVO_SMTP_PORT=%s\nBREVO_SMTP_USER=%s\nBREVO_SMTP_PASS=%s\nMAIL_FROM=no-reply@hetja.in\n' "$BREVO_SMTP_HOST" "${BREVO_SMTP_PORT:-587}" "$BREVO_SMTP_USER" "$BREVO_SMTP_PASS"
            # One proxy hop: cloudflared -> Caddy (loopback) -> API.
            printf 'TRUST_PROXY=1\nCORS_ORIGINS=https://hetja.in,https://www.hetja.in\n'
            printf 'STORAGE_BACKEND=local\nSTORAGE_LOCAL_DIR=/srv/hetja/photos\n'
            # Absolute photo URLs in dog profiles (Caddy serves /photos/* on api.hetja.in).
            printf 'PUBLIC_API_ORIGIN=https://api.hetja.in\n'
          } > "$RUNNER_TEMP/api.env"
          printf 'NEXT_PUBLIC_API_URL=https://api.hetja.in\n' > "$RUNNER_TEMP/web.env"

      - name: SSH setup (deploy key for the unprivileged hetja user, pinned host key)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Ship and deploy (runs as hetja inside the room)
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          O=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes)
          scp "${O[@]}" -P "$SSH_PORT" "$RUNNER_TEMP/$ID.tar.gz" "$RUNNER_TEMP/api.env" "$RUNNER_TEMP/web.env" \
            "$SSH_USER@$SSH_HOST:/srv/hetja/incoming/"
          ssh "${O[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "/srv/hetja/bin/hetja-deploy '$ID'"

      - name: Public check through Cloudflare
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://hetja.in/ || true)"
            echo "https://hetja.in -> $code"
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::hetja.in did not return 200 through the tunnel"; exit 1

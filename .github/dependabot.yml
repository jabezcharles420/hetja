# Dependency update PRs (enhancement stack §Q Top-25 #24, §L.5).
#
# Dependabot rather than Renovate, deliberately: the enhancement-stack doc's own
# advice is to "start with Dependabot (free, zero-config); switch to Renovate the
# day you find yourself merging five identical bump-next PRs." Renovate's
# monorepo grouping is genuinely better, but it is a hosted app to install and
# configure, and this repository does not yet have the PR volume to justify it.
#
# Both run on GitHub's infrastructure, which is the property that matters here:
# AGENTS.md §g records that an unbounded build has OOM-killed the live services
# on this 2 GB box, so dependency resolution must never happen on it.
#
# Every PR these open runs the full ci.yml gate set (typecheck, tests against a
# real PostGIS database, security gate, EXPLAIN gate, contrast gate, Caddy
# cache-policy gate, systemd wiring gate, and the 40 KB scan budget). That is the
# point: an automated bump that breaks an invariant fails before a human reads it.
version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm / pnpm. One entry per workspace package: Dependabot does not follow
  # pnpm-workspace.yaml, so a single root entry would silently ignore every
  # dependency in apps/* and packages/* — which is all of them.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/api"
      - "/apps/web"
      - "/apps/scan"
      - "/apps/worker"
      - "/packages/contracts"
      - "/packages/db"
      - "/packages/design"
      - "/packages/ledger"
    schedule:
      interval: weekly
      day: sunday
      time: "04:00"
      timezone: Asia/Kolkata
    # Weekly, not daily, and capped: this is a small team and a queue of 30 open
    # bump PRs is reviewed as carefully as a queue of zero.
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps of everything, in one PR per ecosystem run. These
      # are the ones where CI passing is genuinely most of the review, and they
      # are where the security value lives.
      routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # NOTE: there is deliberately no `major` group. An earlier version of this
      # file had one, with a comment claiming "majors get their own PR each,
      # because a major is a reading task" — which is the opposite of what
      # grouping does. It produced PR #5: "bump the major group across 3
      # directories with 8 updates". Eight breaking changes in one diff is not
      # reviewable, so it would have sat open forever or been merged unread.
      # Both outcomes are worse than not opening it.
    ignore:
      # Majors are not automated at all here, and that is a deliberate trade
      # rather than neglect. This is a two-person project on one box; the useful
      # half of dependabot is the weekly minor/patch sweep, and a queue of
      # breaking-change PRs nobody has time to read is just red CI that trains
      # you to ignore CI. Majors get done when someone opens the changelog.
      #
      # The cost, stated honestly: dependabot's ignore rules apply to security
      # updates too, so a CVE whose only fix is a major bump will NOT open a PR
      # here. Mitigate by leaving Dependabot **alerts** enabled in repo settings
      # (Settings -> Code security) — alerts still fire, and then the upgrade is
      # done by hand, on purpose. Check them monthly; that is the whole cost of
      # this trade.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      #
      # Two specific ones worth naming even though the wildcard above covers
      # them, because the reason is not "no time" but "this is a project":
      #
      # Next 14 -> 15 is an App Router migration, not a bump.
      # web-vitals is apps/scan's only runtime dependency, and apps/scan has a
      # hard 40 KB gzipped budget (INVARIANT 13) — bumping it is a bundle-size
      # decision the size gate will catch, but which should be made on purpose
      # rather than merged from a green PR.
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # ---------------------------------------------------------------------------
  # GitHub Actions. Pinning drift here is a supply-chain question, not a
  # feature question — a compromised third-party action in ci.yml or deploy.yml
  # runs with this repository's deploy secrets (DEPLOY_SSH_KEY, the Supabase
  # password). Worth keeping current.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(actions)"
    ignore:
      # Action majors are held back, and this is the reason rather than a shrug.
      #
      # Within an hour of adding dependabot it opened `setup-node 4 -> 7`,
      # `pnpm/action-setup 4 -> 6` and `actions/cache 4 -> 6`, and the `quality`
      # job failed. Not a flake, and not the merged code — that was verified
      # separately by running the suites against the real PostGIS database
      # (apps/api 173/173, apps/worker 3/3, all five EXPLAIN queries).
      #
      # The first two bumps change the pnpm install contract that this
      # workflow's step ORDER depends on: ci.yml runs pnpm/action-setup BEFORE
      # setup-node and passes no `version:`, because v4 reads `packageManager`
      # from package.json and giving it both fails with "Multiple versions of
      # pnpm specified". There is a comment saying exactly that above the steps.
      # Later majors change how the version resolves and how `cache: pnpm`
      # locates a store, so the job dies at `pnpm install` before a test runs.
      #
      # Naming actions one at a time turned out to be whack-a-mole — cache/4->6
      # arrived while the first two were being held — so this is a wildcard.
      # The underlying reason generalises: CI infrastructure is the one thing CI
      # passing cannot validate. A green run after changing the runner setup only
      # proves the new setup works for the happy path; a red one does not say
      # which half broke. Adopting an action major means reading a changelog and
      # watching a run, which is a task, not a merge.
      #
      # Minor and patch bumps still flow, which is where action security fixes
      # actually land (actions are pinned by major tag, so v4 keeps receiving
      # them).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

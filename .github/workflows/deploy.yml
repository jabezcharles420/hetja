# .github/workflows/deploy.yml — push to main, everything follows.
#
# Gate -> Migrate -> Deploy. Nothing in Migrate or Deploy runs unless Gate is
# fully green, and Deploy never runs unless Migrate (including its destructive-
# change check) passes. The VPS never builds anything: apps/web and
# apps/scan are built here on the runner and shipped over rsync into a
# timestamped release directory, with a `current` symlink flipped on the
# box -- see ops/deploy-remote.sh for the server-side half, and
# apps/web/next.config.mjs for why `output: 'standalone'` is required (the
# box is a 2 GB VPS that `next build` previously OOM-killed alongside the
# already-running services).
#
# ---------------------------------------------------------------------------
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#
#   Deploy SSH access to the VPS
#     DEPLOY_SSH_KEY        Private half of a NEW, dedicated ed25519 deploy
#                            key -- generate one specifically for this
#                            pipeline (e.g. `ssh-keygen -t ed25519 -C
#                            "github-actions-deploy@hetja"`) and add the
#                            public half to the VPS's authorized_keys for
#                            the deploy user. Do NOT reuse `webapp_deploy` --
#                            that is GitHub's own key for its side of the
#                            pull (e.g. pulling from a private registry or
#                            similar), a different trust boundary from "a
#                            CI runner can SSH into production."
#     DEPLOY_SSH_HOST        VPS hostname/IP (NAT'd -- the runner connects
#                            OUT to it, so no inbound firewall change is
#                            needed).
#     DEPLOY_SSH_PORT        Non-standard SSH port. Never hardcode this --
#                            it lives in the deploy operator's local
#                            ~/.ssh/config (Host aic) precisely because the
#                            host is NAT'd behind a port that isn't 22.
#     DEPLOY_SSH_USER         SSH user on the VPS (currently `root`).
#
#   Supabase (migration stage, applied over the connection pooler)
#     SUPABASE_POOLER_HOST    e.g. aws-0-ap-south-1.pooler.supabase.com
#     SUPABASE_POOLER_PORT    Use the SESSION pooler port (5432), not the
#                            transaction pooler (6543) -- migrate.ts runs
#                            multi-statement transactions per file, which
#                            the transaction pooler's connection reuse can
#                            break.
#     SUPABASE_PROJECT_REF    The project ref segment from the dashboard
#                            URL; the pooler username is
#                            `postgres.<project-ref>`.
#     SUPABASE_DB_PASSWORD    The project's database password (not an API
#                            key).
#
#   Brevo SMTP (reserved -- a sibling agent is wiring up email OTP delivery
#   separately; these names are reserved now so that work can land without
#   a workflow edit, but nothing in this workflow reads them yet)
#     BREVO_SMTP_HOST
#     BREVO_SMTP_PORT
#     BREVO_SMTP_USER
#     BREVO_SMTP_PASSWORD
#
# ---------------------------------------------------------------------------

name: Deploy

on:
  push:
    branches: [main]

# Never run two deploys at once against the same box; let one finish
# (including any rollback) before the next starts.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  NODE_VERSION: 20

jobs:
  # =========================================================================
  # GATE -- must be fully green before anything touches Supabase or the VPS.
  # Pattern copied from .github/workflows/ci.yml (not edited here).
  # =========================================================================
  gate:
    name: Gate (typecheck, test, security, size)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: hetja_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: hetja_dev_2026
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: hetja_test
      PGUSER: app_user
      PGPASSWORD: hetja_dev_2026
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      # No `version:` here on purpose: pnpm/action-setup@v4 reads
      # `packageManager` from package.json, and passing both makes it
      # fail with "Multiple versions of pnpm specified".

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install pgvector into the Postgres service container
        # postgis/postgis ships PostGIS + contrib but not pgvector, and no
        # official image carries both. 0001_init.sql needs VECTOR(768) for
        # dogs.cv_embedding, so pull it from PGDG (already configured in the
        # image) rather than maintaining a custom image for CI.
        run: |
          set -euo pipefail
          CID=$(docker ps --filter "ancestor=postgis/postgis:16-3.4" --format '{{.ID}}' | head -1)
          if [ -z "$CID" ]; then
            echo "::error::could not find the postgres service container"
            docker ps
            exit 1
          fi
          docker exec "$CID" bash -c \
            'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-16-pgvector'

      - name: Enable PostGIS, pgvector and pgcrypto
        run: |
          set -euo pipefail
          for ext in postgis vector pgcrypto; do
            echo "--> CREATE EXTENSION $ext"
            psql -h 127.0.0.1 -U app_user -d hetja_test \
              -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS $ext;"
          done

      - name: Apply migrations
        run: pnpm --filter @hetja/db migrate

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Unit tests (all packages)
        run: pnpm -r test

      - name: Security gate
        run: bash ops/security-gate.sh

      - name: EXPLAIN gate (INVARIANT 12)
        run: bash ops/check-queries.sh

      - name: Scan bundle size gate (<40 KB gzipped)
        run: pnpm --filter @hetja/scan size:gate

  # =========================================================================
  # MIGRATE -- fail closed on anything destructive. medical_records is
  # append-only and a bad migration against the live Supabase project is not
  # reversible, so this is the one gate in the whole pipeline with no
  # override except an explicit human marker committed to the SQL file
  # itself.
  # =========================================================================
  migrate:
    name: Migrate (destructive-change gate, then apply)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      # No `version:` here on purpose: pnpm/action-setup@v4 reads
      # `packageManager` from package.json, and passing both makes it
      # fail with "Multiple versions of pnpm specified".

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Find migrations new in this push
        id: new_migrations
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            # First push to main we've seen the parent of (new branch, or a
            # force-push GitHub reports as all-zeros before): fall back to
            # the immediate parent commit rather than skipping the check.
            BASE="$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo "")"
          fi

          if [ -z "$BASE" ]; then
            echo "no usable base commit -- treating every existing migration file as new"
            FILES="$(git ls-files 'packages/db/migrations/*.sql')"
          else
            echo "diffing $BASE..${{ github.sha }}"
            FILES="$(git diff --diff-filter=A --name-only "$BASE" "${{ github.sha }}" -- 'packages/db/migrations/*.sql')"
          fi

          echo "new migration files:"
          echo "${FILES:-<none>}"

          {
            echo "files<<__EOF__"
            echo "$FILES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Destructive-change gate
        run: |
          set -euo pipefail
          FILES="${{ steps.new_migrations.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "no new migration files in this push -- nothing to gate"
            exit 0
          fi

          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if grep -iE '\b(DROP|TRUNCATE|DELETE)\b' "$f" | grep -v '^--' >/dev/null; then
              if grep -qE -- '-- MIGRATION-APPROVED:[[:space:]]*\S' "$f"; then
                echo "OK (approved): $f"
                grep -nE -- '-- MIGRATION-APPROVED:' "$f"
              else
                echo "::error file=$f::destructive statement (DROP/TRUNCATE/DELETE) found with no '-- MIGRATION-APPROVED: <reason>' line in this file. medical_records is append-only and a bad migration against Supabase is not reversible -- this needs an explicit human sign-off marker in the SQL file itself, not just a passing test suite."
                fail=1
              fi
            else
              echo "OK (additive): $f"
            fi
          done <<< "$FILES"

          exit "$fail"

      - name: Apply migrations to Supabase (session pooler)
        env:
          PGHOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          PGPORT: ${{ secrets.SUPABASE_POOLER_PORT }}
          PGDATABASE: postgres
          PGUSER: postgres.${{ secrets.SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: pnpm --filter @hetja/db migrate

  # =========================================================================
  # DEPLOY -- build once here, ship the artifact, flip a symlink on the box.
  # =========================================================================
  deploy:
    name: Deploy (build, rsync, flip symlink, health-check)
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      # No `version:` here on purpose: pnpm/action-setup@v4 reads
      # `packageManager` from package.json, and passing both makes it
      # fail with "Multiple versions of pnpm specified".

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: SSH setup (dedicated deploy key, non-standard port)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fetch production web env (NEXT_PUBLIC_* is inlined at build time)
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          # apps/web/.env.production is never committed (see .env.example),
          # and NEXT_PUBLIC_* values are baked into the JS bundle at build
          # time, not read at runtime -- so building on the runner instead of
          # the VPS only produces the right bundle if the runner sees the
          # same values the box already has. Pull that one file over the
          # same deploy SSH connection rather than duplicating its contents
          # into a second set of GitHub Secrets that could drift from it.
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST:/root/hetja/apps/web/.env.production" \
            apps/web/.env.production

      - name: Build @hetja/scan
        run: pnpm --filter @hetja/scan build

      - name: Build @hetja/web (standalone)
        run: pnpm --filter @hetja/web build

      - name: Assemble standalone web bundle
        run: |
          set -euo pipefail
          # `output: standalone` traces only the JS/node_modules a running
          # server needs -- it deliberately omits .next/static (hashed
          # client assets) and public/ (fonts, icons, manifest, sw.js),
          # which the Next docs say to copy in by hand. Both must land
          # inside the traced apps/web/ subtree so the standalone server.js
          # finds them relative to itself.
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public

      - name: Compute release name
        id: release
        run: echo "name=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Rsync web + scan to a new release directory on the VPS
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes"
          REMOTE="$SSH_USER@$SSH_HOST"
          RELEASE_DIR="/srv/hetja/releases/${RELEASE}"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$REMOTE" \
            "mkdir -p '${RELEASE_DIR}/web' '${RELEASE_DIR}/scan/scripts'"

          rsync -az --delete -e "$RSYNC_SSH" \
            apps/web/.next/standalone/ "$REMOTE:${RELEASE_DIR}/web/"

          rsync -az --delete -e "$RSYNC_SSH" \
            apps/scan/dist/ "$REMOTE:${RELEASE_DIR}/scan/dist/"

          rsync -az -e "$RSYNC_SSH" \
            apps/scan/scripts/serve.mjs "$REMOTE:${RELEASE_DIR}/scan/scripts/serve.mjs"

          # Always ship the latest deploy-remote.sh alongside the release it
          # is about to act on, rather than trusting whatever copy happens
          # to already be on the box (the VPS git checkout is not part of
          # this pipeline's build/deploy path -- see ops/deploy-remote.sh).
          rsync -az -e "$RSYNC_SSH" \
            ops/deploy-remote.sh "$REMOTE:/srv/hetja/deploy-remote.sh"

      - name: Flip symlink, restart units, health-check, auto-rollback
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          RELEASE: ${{ steps.release.outputs.name }}
          PGHOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          PGPORT: ${{ secrets.SUPABASE_POOLER_PORT }}
          PGUSER: postgres.${{ secrets.SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "PGHOST='$PGHOST' PGPORT='$PGPORT' PGDATABASE=postgres PGUSER='$PGUSER' PGPASSWORD='$PGPASSWORD' PGSSLMODE=require \
             bash /srv/hetja/deploy-remote.sh '$RELEASE'"
